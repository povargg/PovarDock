name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Locate the Windows SDK shader compiler
        shell: pwsh
        run: |
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $fxc = Get-ChildItem -Path (Join-Path $sdk '*\x64\fxc.exe') -File |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $fxc) { throw 'The Windows SDK shader compiler was not found.' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - name: Check the release tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid stable release tag $tag" }
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $versions = @($metadata.packages | ForEach-Object { "v$($_.version)" } | Select-Object -Unique)
          if ($versions.Count -ne 1 -or $versions[0] -ne $tag) { throw "Cargo versions must match $tag." }
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p wisp --bin wisp
      - name: Package
        shell: pwsh
        run: ./scripts/package-release.ps1 -Executable ./target/release/wisp.exe -OutputDirectory ./dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --json isDraft 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $tag already exists."
            exit 0
          }

          gh release create $tag ./dist/windock-x64.exe ./dist/SHA256SUMS.txt --verify-tag --draft --title "WinDock $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false
          exit $LASTEXITCODE
